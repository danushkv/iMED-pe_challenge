name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run python scripts/audit_release.py

