[project]
name = "imedpe-vggt-environment"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "einops==0.8.1",
  "huggingface-hub>=0.24,<1",
  "numpy==1.26.4",
  "opencv-python-headless==4.9.0.80",
  "pillow>=10,<12",
  "safetensors>=0.4,<1",
  "scipy==1.11.4",
  "torch==2.1.2+cu118",
  "torchvision==0.16.2+cu118",
  "tqdm==4.66.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

