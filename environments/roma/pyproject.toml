[project]
name = "imedpe-roma-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "albumentations==2.0.8",
  "einops==0.8.2",
  "fused-local-corr==0.3.211",
  "h5py==3.16.0",
  "joblib==1.5.3",
  "kornia==0.8.2",
  "lightglue",
  "loguru==0.7.3",
  "matplotlib==3.10.9",
  "numpy==2.2.6",
  "opencv-python==5.0.0.93",
  "pillow==12.3.0",
  "poselib==2.0.5",
  "pyyaml==6.0.3",
  "scipy==1.15.3",
  "timm==1.0.28",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "tqdm==4.70.0",
  "wandb==0.29.0",
  "yacs==0.1.8",
]

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue.git", rev = "eb42fee2d71449efb0aa5c10549752b5d75384d8" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
