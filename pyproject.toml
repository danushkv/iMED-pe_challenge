[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "imedpe-challenge-methods"
version = "0.1.0"
description = "Reproducible camera-pose methods developed for the iMED Pose Estimation Challenge"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "einops==0.8.2",
  "joblib==1.5.3",
  "kornia==0.8.2",
  "lightglue",
  "loguru==0.7.3",
  "matplotlib==3.10.9",
  "numpy==2.2.6",
  "opencv-python==5.0.0.93",
  "pillow==12.3.0",
  "pyyaml==6.0.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "tqdm==4.70.0",
  "yacs==0.1.8",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imcpe"]

[tool.uv.sources]
lightglue = { git = "https://github.com/cvg/LightGlue.git", rev = "eb42fee2d71449efb0aa5c10549752b5d75384d8" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
